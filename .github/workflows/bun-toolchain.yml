name: bun-toolchain

# rustc/cargo + clang/lld built from this branch and src/llvm-project, PGO/BOLT
# trained on compiling Bun. See bun/README.md.
#
# Per host: `rust` and `llvm` build the two halves in parallel and upload their
# install trees; `package` puts them together, builds Bun with the result as a
# smoke test, and uploads the tarball; `release` publishes both hosts' tarballs.

on:
  workflow_dispatch:
    inputs:
      bun-ref:
        description: oven-sh/bun commit to train on (default is pinned in bun/lib/options.ts)
        required: false
      skip-bolt:
        type: boolean
        default: false
  push:
    branches: ["nightly-*-bun"]
    paths: ["bun/**", "!bun/README.md", ".github/workflows/bun-toolchain.yml", "src/tools/opt-dist/**", "src/llvm-project"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TOOLCHAIN_ARGS: ${{ inputs.bun-ref && format('--bun-ref={0}', inputs.bun-ref) || '' }} ${{ inputs.skip-bolt && '--skip-bolt' || '' }}
  # bun/Dockerfile, built once per Dockerfile change and kept in GHCR; jobs append :<dockerfile hash>-<host>.
  IMAGE: ghcr.io/${{ github.repository_owner }}/bun-toolchain-env
  # As the runner's user, so the checkout is trusted by git and outputs are owned
  # by the steps that upload them; HOME holds cargo/npm/bun caches.
  IN_CONTAINER: >-
    docker run --rm -v $PWD:/checkout -w /checkout
    --user $UID:$GID -e HOME=/checkout/obj/home
    -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro
    bun-toolchain-env

jobs:
  # The build environment image. Pushing needs the workflow token to be allowed to
  # publish packages; if it is not, the other jobs fall back to building it locally.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: image ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { sparse-checkout: bun, fetch-depth: 1 }
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push (if missing)
        id: build
        run: |
          tag="$IMAGE:${{ hashFiles('bun/Dockerfile') }}-${{ matrix.host }}"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          docker build -t "$tag" bun
          docker push "$tag" && echo "pushed=true" >> "$GITHUB_OUTPUT" || echo "::warning::could not push $tag; later jobs will rebuild the image"
      - name: Delete superseded images for this host
        if: steps.build.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="${{ hashFiles('bun/Dockerfile') }}-${{ matrix.host }}"
          gh api --paginate "/orgs/${{ github.repository_owner }}/packages/container/bun-toolchain-env/versions" \
            --jq '.[] | select([.metadata.container.tags[] | endswith("-${{ matrix.host }}")] | any) | select(.metadata.container.tags | index("'"$keep"'") | not) | .id' |
          while read -r id; do
            echo "deleting package version $id"
            gh api -X DELETE "/orgs/${{ github.repository_owner }}/packages/container/bun-toolchain-env/versions/$id" || true
          done

  rust:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: rust ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { submodules: false, fetch-depth: 1 }
      - name: Fetch src/llvm-project
        run: git submodule update --init --depth=1 src/llvm-project
      - name: Container image
        run: |
          tag="$IMAGE:${{ hashFiles('bun/Dockerfile') }}-${{ matrix.host }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$tag" && docker tag "$tag" bun-toolchain-env || docker build -t bun-toolchain-env bun
      - name: Build rustc + cargo
        run: mkdir -p obj/home && GID=$(id -g) && eval "$IN_CONTAINER node bun/toolchain.ts rust $TOOLCHAIN_ARGS"
      - name: Pack sysroot
        run: tar --zstd -cf rust-sysroot-${{ matrix.host }}.tar.zst -C obj/bun-toolchain rust-sysroot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-sysroot-${{ matrix.host }}
          path: |
            rust-sysroot-${{ matrix.host }}.tar.zst
            obj/bun-toolchain/rust/opt-artifacts/*.profdata
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  llvm:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: llvm ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { submodules: false, fetch-depth: 1 }
      - name: Fetch src/llvm-project
        run: git submodule update --init --depth=1 src/llvm-project
      - name: Container image
        run: |
          tag="$IMAGE:${{ hashFiles('bun/Dockerfile') }}-${{ matrix.host }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$tag" && docker tag "$tag" bun-toolchain-env || docker build -t bun-toolchain-env bun
      - name: Build clang + lld
        run: mkdir -p obj/home && GID=$(id -g) && eval "$IN_CONTAINER node bun/toolchain.ts llvm $TOOLCHAIN_ARGS"
      - name: Pack install
        run: tar --zstd -cf llvm-install-${{ matrix.host }}.tar.zst -C obj/bun-toolchain llvm-install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-install-${{ matrix.host }}
          path: llvm-install-${{ matrix.host }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  package:
    needs: [rust, llvm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: package ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { submodules: false, fetch-depth: 1 }
      - name: Container image
        run: |
          tag="$IMAGE:${{ hashFiles('bun/Dockerfile') }}-${{ matrix.host }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$tag" && docker tag "$tag" bun-toolchain-env || docker build -t bun-toolchain-env bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "rust-sysroot-${{ matrix.host }}", path: . }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "llvm-install-${{ matrix.host }}", path: . }
      - name: Unpack
        run: |
          mkdir -p obj/bun-toolchain obj/home
          tar --zstd -xf rust-sysroot-${{ matrix.host }}.tar.zst -C obj/bun-toolchain
          tar --zstd -xf llvm-install-${{ matrix.host }}.tar.zst -C obj/bun-toolchain
      - name: Package + smoke build
        run: GID=$(id -g) && eval "$IN_CONTAINER node bun/toolchain.ts package $TOOLCHAIN_ARGS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-toolchain-${{ matrix.host }}
          path: |
            obj/bun-toolchain/out/*.tar.zst
            obj/bun-toolchain/out/*/toolchain.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bun-toolchain-*
          path: artifacts
      # artifacts/bun-toolchain-<host>/{bun-toolchain-<host>.tar.zst, bun-toolchain-<host>/toolchain.json}
      - name: Collect assets
        run: |
          mkdir assets
          for dir in artifacts/bun-toolchain-*/; do
            name=$(basename "$dir")
            cp "$dir/$name.tar.zst" assets/
            cp "$dir/$name/toolchain.json" "assets/$name.json"
          done
          ls -l assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bun-toolchain-${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
              --notes "rustc/cargo + clang/lld for building Bun, built from ${GITHUB_SHA} by bun/toolchain.ts. bun-toolchain-<host>.json says what each tarball was built and trained from."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber assets/*
