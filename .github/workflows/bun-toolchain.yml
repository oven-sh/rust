name: bun-toolchain

# rustc/cargo + clang/lld built from this branch and src/llvm-project, PGO/BOLT
# trained on compiling Bun. See bun/README.md.
#
# Two jobs per host so that a failure in the LLVM half does not throw away the
# ~2 h rust half: `rust` uploads the installed sysroot, `llvm` downloads it,
# builds clang/lld (its training links Bun with that rustc) and packages both.

on:
  workflow_dispatch:
    inputs:
      bun-ref:
        description: oven-sh/bun commit to train on (default is pinned in bun/lib/options.ts)
        required: false
      skip-bolt:
        type: boolean
        default: false
  push:
    branches: ["nightly-*-bun"]
    paths: ["bun/**", ".github/workflows/bun-toolchain.yml", "src/tools/opt-dist/**", "src/llvm-project"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TOOLCHAIN_ARGS: ${{ inputs.bun-ref && format('--bun-ref={0}', inputs.bun-ref) || '' }} ${{ inputs.skip-bolt && '--skip-bolt' || '' }}
  # bun/Dockerfile, built once per Dockerfile change and kept in GHCR (private).
  IMAGE: ghcr.io/${{ github.repository_owner }}/bun-toolchain-env:${{ hashFiles('bun/Dockerfile') }}
  # As the runner's user, so the checkout is trusted by git and outputs are owned
  # by the steps that upload them; HOME holds cargo/npm/bun caches.
  IN_CONTAINER: >-
    docker run --rm -v $PWD:/checkout -w /checkout
    --user $UID:$GID -e HOME=/checkout/obj/home
    -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro
    bun-toolchain-env

jobs:
  # The build environment image. Pushing needs the workflow token to be allowed to
  # publish packages; if it is not, the other jobs fall back to building it locally.
  image:
    strategy:
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: image ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { sparse-checkout: bun, fetch-depth: 1 }
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push (if missing)
        run: |
          tag="$IMAGE-${{ matrix.host }}"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          docker build -t "$tag" bun
          docker push "$tag" || echo "::warning::could not push $tag; later jobs will rebuild the image"

  rust:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: rust ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { submodules: false, fetch-depth: 1 }
      - name: Fetch src/llvm-project
        run: git submodule update --init --depth=1 src/llvm-project
      - name: Container image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE-${{ matrix.host }}" && docker tag "$IMAGE-${{ matrix.host }}" bun-toolchain-env || docker build -t bun-toolchain-env bun
      - name: Build rustc + cargo
        run: mkdir -p obj/home && GID=$(id -g) && eval "$IN_CONTAINER node bun/toolchain.ts rust $TOOLCHAIN_ARGS"
      - name: Pack sysroot
        run: tar --zstd -cf rust-sysroot-${{ matrix.host }}.tar.zst -C obj/bun-toolchain rust-sysroot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-sysroot-${{ matrix.host }}
          path: |
            rust-sysroot-${{ matrix.host }}.tar.zst
            obj/bun-toolchain/rust/opt-artifacts/*.profdata
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  llvm:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: linux-x64-gh }
          - { host: linux-aarch64, runner: linux-arm64-gh }
    name: llvm + package ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { submodules: false, fetch-depth: 1 }
      - name: Fetch src/llvm-project
        run: git submodule update --init --depth=1 src/llvm-project
      - name: Container image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE-${{ matrix.host }}" && docker tag "$IMAGE-${{ matrix.host }}" bun-toolchain-env || docker build -t bun-toolchain-env bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "rust-sysroot-${{ matrix.host }}", path: . }
      - name: Unpack sysroot
        run: mkdir -p obj/bun-toolchain obj/home && tar --zstd -xf rust-sysroot-${{ matrix.host }}.tar.zst -C obj/bun-toolchain
      - name: Build clang + lld
        run: GID=$(id -g) && eval "$IN_CONTAINER node bun/toolchain.ts llvm $TOOLCHAIN_ARGS"
      - name: Package
        run: GID=$(id -g) && eval "$IN_CONTAINER node bun/toolchain.ts package $TOOLCHAIN_ARGS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-toolchain-${{ matrix.host }}
          path: |
            obj/bun-toolchain/out/*.tar.zst
            obj/bun-toolchain/out/*/toolchain.json
          if-no-files-found: error
          compression-level: 0

  release:
    needs: llvm
    # Off until an artifact has been validated by building Bun with it; flip to publish.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bun-toolchain-${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "rustc/cargo + clang/lld for building Bun, from ${GITHUB_SHA}." \
            artifacts/bun-toolchain-*/out/*.tar.zst artifacts/rust-sysroot-*/obj/bun-toolchain/rust/opt-artifacts/*.profdata
